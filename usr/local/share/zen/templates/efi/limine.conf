timeout: 5
default_entry: 1
editor_enabled: no
terse: yes
quiet: yes
interface_help_hidden: yes

interface_branding: zen
interface_branding_colour: {{accent|hex}}
interface_help_colour: {{line|hex}}
interface_help_colour_bright: {{accent|hex}}

term_palette: {{color0|hex}};{{color1|hex}};{{color2|hex}};{{color3|hex}};{{color4|hex}};{{color5|hex}};{{color6|hex}};{{color7|hex}}
term_palette_bright: {{color8|hex}};{{color9|hex}};{{color10|hex}};{{color11|hex}};{{color12|hex}};{{color13|hex}};{{color14|hex}};{{color15|hex}}
term_background: 00{{bg|hex}}
term_foreground: {{fg|hex}}
term_background_bright: {{line|hex}}
term_foreground_bright: {{color15|hex}}

/Arch Linux
    protocol: efi
    path: boot():/EFI/Linux/arch-linux.efi

/Arch Linux LTS
    protocol: efi
    path: boot():/EFI/Linux/arch-linux-lts.efi

